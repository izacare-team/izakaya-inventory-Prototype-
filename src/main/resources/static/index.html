  var dark = saved
    ? saved === 'dark'
    : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

})();

<script>
/* ===================== XSS 방지 =====================
   html`` 태그드 템플릿 — 삽입되는 ${값}을 자동으로 HTML 이스케이프한다.
   중첩된 html`` 결과, 그 배열, raw()로 감싼 값만 그대로 삽입된다.

   ⚠ 화면을 새로 만들 때도 반드시 html`` 을 쓸 것.
     그냥 `` 로 만들어 innerHTML에 넣으면 XSS가 다시 열린다.
   ⚠ 이스케이프는 HTML 문맥만 막아준다. onclick="fn('${값}')" 처럼
     속성 안의 JS 문자열에는 사용자 입력을 넣지 말 것 (&#39;로 바뀌어도
     브라우저가 다시 '로 되돌리므로 탈출이 가능하다). data-* 속성을 쓸 것. */
class SafeHtml {
  constructor(s) { this.s = s; }
  toString() { return this.s; }
}
const raw = v => new SafeHtml(String(v));
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

function escVal(v) {
  if (v instanceof SafeHtml) return v.s;
  if (Array.isArray(v)) return v.map(escVal).join('');
  if (v === null || v === undefined || v === false) return '';
  return String(v).replace(/[&<>"']/g, c => ESC_MAP[c]);
}

function html(strings, ...vals) {
  let out = strings[0];
  for (let i = 0; i < vals.length; i++) out += escVal(vals[i]) + strings[i + 1];
  return new SafeHtml(out);
}

/* ===================== 공통 유틸 ===================== */
const $view = document.getElementById('view');
let me = null;                  // 로그인 사용자 {id, username, displayName, role}
const isOwner = () => me?.role === 'OWNER';
const fmtD = d => d ? d.replaceAll('-', '/').slice(5) : '';   // 2026-08-20 → 08/20
const today = () => new Date().toISOString().slice(0, 10);

async function api(url, opt) {
  const res = await fetch(url, opt);
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (res.status === 401 && !url.startsWith('/api/auth/')) {
    me = null; go('login');
    throw new Error(body?.error ?? '로그인이 필요합니다.');
  }
  if (!res.ok) throw new Error(body?.error ?? 'HTTP ' + res.status);
  return body;
}
const postJson = (url, data) => api(url, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
});

function go(route, arg) { location.hash = arg !== undefined ? route + '/' + arg : route; }

/* ===================== 테마 (라이트 / 다크) ===================== */

function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  // 모바일 주소창 색도 함께 (CSS 변수는 여기서 못 읽으므로 값을 직접 지정)
  const meta = document.getElementById('themeColor');
  if (meta) meta.content = dark ? '#1c1e21' : '#ffffff';
}

function toggleTheme() {
  const dark = !isDark();
  applyTheme(dark);
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) { /* 무시 */ }
}

/** 헤더에 넣을 테마 버튼 — 라이트일 땐 달, 다크일 땐 해가 보인다 */
function themeButtonHtml() {
  return html`<button class="icon-btn" title="라이트/다크 전환" onclick="toggleTheme()">
    <svg class="mi mi-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.9-3.4 2.26-4.4A9.4 9.4 0 0 0 12 3z"/></svg>
    <svg class="mi mi-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-4.5a1 1 0 0 1 1 1V5a1 1 0 0 1-2 0V3.5a1 1 0 0 1 1-1zm0 16a1 1 0 0 1 1 1v1.5a1 1 0 0 1-2 0V19.5a1 1 0 0 1 1-1zM3.5 11H5a1 1 0 0 1 0 2H3.5a1 1 0 0 1 0-2zm15.5 0h1.5a1 1 0 0 1 0 2H19a1 1 0 0 1 0-2zM5.64 4.22 6.7 5.28a1 1 0 0 1-1.42 1.42L4.22 5.64a1 1 0 0 1 1.42-1.42zm12.72 12.72 1.06 1.06a1 1 0 0 1-1.42 1.42l-1.06-1.06a1 1 0 0 1 1.42-1.42zM18.36 4.22a1 1 0 0 1 1.42 1.42L18.72 6.7a1 1 0 0 1-1.42-1.42zM5.28 17.3a1 1 0 0 1 1.42 1.42l-1.06 1.06a1 1 0 0 1-1.42-1.42z"/></svg>
  </button>`;
}

function topbar(title, backTo, extraHtml = '') {
  return html`<div class="topbar">
    ${backTo !== undefined ? html`<button class="back" onclick="go('${backTo}')">←</button>` : ''}
    <h1>${title}</h1><div class="spacer"></div>${extraHtml}
  </div>`;
}

/* ===================== 라우터 ===================== */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', async () => {
  try { me = await api('/api/auth/me'); } catch { me = null; }
  render();
});

function render() {
  closeStockSheet();   // 화면 전환 시 열려 있던 액션 시트 정리
  const [route, arg] = (location.hash.replace('#', '') || 'home').split('/');
  const authRoutes = ['login', 'signup'];
  document.getElementById('bottomNav').style.display = me ? 'flex' : 'none';

  if (!me && !authRoutes.includes(route)) { viewLogin(); return; }
  if (me && authRoutes.includes(route)) { go('home'); return; }

  document.querySelectorAll('.nav-pill').forEach(b =>
    b.classList.toggle('on', b.dataset.r === route));
  const views = {
    login: viewLogin, signup: viewSignup, staff: viewStaff,
    home: viewHome, stock: viewStock, inbound: () => viewInbound(arg), dispose: viewDispose,
    audit: viewAudit, attendance: viewAttendance, calendar: viewCalendar,
    reports: viewReports, 'report-new': viewReportNew, report: () => viewReportDetail(arg),
    reserve: viewReserve, 'course-list': viewCourseList,
    'reserve-new': viewReserveNew, 'reserve-list': viewReserveList,
    reservation: () => viewReservationDetail(arg), tables: viewTables,
    settings: viewSettings
  };
  (views[route] ?? viewHome)();
  window.scrollTo(0, 0);
}

/* ===================== 로그인 / 회원가입 ===================== */
function viewLogin() {
  document.getElementById('bottomNav').style.display = 'none';
  $view.innerHTML = html`
    <div style="display:flex; justify-content:flex-end">${themeButtonHtml()}</div>
    <div style="margin-top:44px; text-align:center">
      <h1 style="font-size:2rem">🍶 이자카야<br>매장관리</h1>
    </div>
    <div class="sketch" style="padding:20px; margin-top:20px">
      <label class="field"><span>아이디</span><input id="lgId" autocomplete="username"></label>
      <label class="field"><span>비밀번호</span>
        <div class="pw-wrap">
          <input id="lgPw" type="password" autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="비밀번호 표시">👁</button>
        </div></label>
      <div style="text-align:center; margin-top:16px">
        <button class="act" onclick="doLogin()">로그인</button>
      </div>
      <p id="lgMsg" class="msg" style="text-align:center"></p>
      <p style="text-align:center" class="hint">계정이 없나요?
        <a href="#signup" style="color:var(--blue); font-weight:700">회원가입</a></p>
    </div>
    <p class="hint" style="text-align:center; margin-top:14px">
      데모 — 사장님 boss/1234 · 알바생 staff/1234 (가입 시 가게코드 <b>DEMO01</b>)</p>`;
  document.getElementById('lgPw').addEventListener('keydown',
    e => { if (e.key === 'Enter') doLogin(); });
}
async function doLogin() {
  try {
    me = await postJson('/api/auth/login', {
      username: document.getElementById('lgId').value,
      password: document.getElementById('lgPw').value
    });
    go('home'); render();
  } catch (e) { showMsg('lgMsg', e.message, false); }
}

/** 비밀번호 표시/숨김 토글 — 눈 버튼을 누르면 입력한 값을 확인할 수 있다 */
function togglePw(btn) {
  const input = btn.parentElement.querySelector('input');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
  btn.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 표시');
}
/** 아이디 입력에서 한글(자모·완성형)을 제거한다 — 아이디는 영문·숫자만 허용 */
function stripHangul(input) {
  const v = input.value.replace(/[ㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
  if (v !== input.value) input.value = v;
}

function viewSignup() {
  document.getElementById('bottomNav').style.display = 'none';
  $view.innerHTML = topbar('회원가입', 'login') + html`
    <div class="sketch2" style="padding:20px">
      <label class="field"><span>구분</span>
        <select id="sgRole" onchange="toggleSignupRole()">
          <option value="STAFF">알바생 (가입 후 사장님 승인 필요)</option>
          <option value="OWNER">사장님 (바로 사용 가능)</option>
        </select></label>
      <label class="field" id="sgStoreCodeWrap"><span>가게 코드</span>
        <input id="sgStoreCode" placeholder="사장님께 받은 코드"
               autocapitalize="characters" style="text-transform:uppercase"></label>
      <label class="field" id="sgStoreNameWrap" hidden><span>가게 이름</span>
        <input id="sgStoreName" placeholder="예: 이자카야 하나비"></label>
      <label class="field"><span>이름</span><input id="sgName" placeholder="예: 김가현"></label>
      <label class="field"><span>아이디</span>
        <input id="sgId" autocomplete="username" placeholder="영문·숫자" oninput="stripHangul(this)"></label>
      <label class="field"><span>비밀번호</span>
        <div class="pw-wrap">
          <input id="sgPw" type="password" autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="비밀번호 표시">👁</button>
        </div></label>
      <label class="field"><span>비밀번호 확인</span>
        <div class="pw-wrap">
          <input id="sgPw2" type="password" autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="비밀번호 표시">👁</button>
        </div></label>
      <div style="text-align:center; margin-top:16px">
        <button class="act" onclick="doSignup()">가입하기</button>
      </div>
      <p id="sgMsg" class="msg" style="text-align:center"></p>
    </div>`;
}
function toggleSignupRole() {
  const isOwner = document.getElementById('sgRole').value === 'OWNER';
  document.getElementById('sgStoreNameWrap').hidden = !isOwner;
  document.getElementById('sgStoreCodeWrap').hidden = isOwner;
}
async function doSignup() {
  const isOwner = document.getElementById('sgRole').value === 'OWNER';
  const pw = document.getElementById('sgPw').value;
  const pw2 = document.getElementById('sgPw2').value;
  if (pw !== pw2) { showMsg('sgMsg', '비밀번호가 일치하지 않습니다.', false); return; }
  try {
    const r = await postJson('/api/auth/signup', {
      role: document.getElementById('sgRole').value,
      displayName: document.getElementById('sgName').value,
      username: document.getElementById('sgId').value,
      password: pw,
      storeName: isOwner ? document.getElementById('sgStoreName').value : null,
      storeCode: isOwner ? null : document.getElementById('sgStoreCode').value
    });
    if (isOwner && r.storeCode) {
      // 사장님: 발급된 가게 코드를 크게 안내
      $view.innerHTML = topbar('가게 개설 완료', 'login') + html`
        <div style="margin-top:20px">
          <p style="text-align:center; font-weight:700; font-size:1.2rem; margin:0 0 4px">${r.storeName}</p>
          <p class="hint" style="text-align:center; margin:0 0 14px">${r.message}</p>
          <div class="code-card">
            <div class="code-card-label">가게 코드 · 직원 가입/로그인용</div>
            <div class="code-card-value">
              <span class="code-text">${r.storeCode}</span>
              <button class="code-copy" onclick="copyCode(event, '${r.storeCode}')">📋 복사</button>
            </div>
            <p class="code-hint">직원은 이 코드로 가입·로그인합니다. 가게 설정에서 다시 볼 수 있어요.</p>
          </div>
          <div style="text-align:center"><button class="act" onclick="go('login')">로그인하러 가기</button></div>
        </div>`;
      return;
    }
    showMsg('sgMsg', r.message, true);
    setTimeout(() => go('login'), 1600);
  } catch (e) { showMsg('sgMsg', e.message, false); }
}
async function doLogout() {
  await postJson('/api/auth/logout', {});
  me = null; go('login'); render();
}

/* ===================== 직원 관리 (사장님 전용) ===================== */
async function viewStaff() {
  $view.innerHTML = topbar('직원 관리', 'home') + html`
    <p class="hint">퇴직 처리하면 로그인과 모든 기능 접근 권한이 즉시 사라집니다.</p>
    <div id="staffList">불러오는 중...</div>
    <p id="stMsg" class="msg"></p>`;
  loadStaff();
}
async function loadStaff() {
  const ROLE = { OWNER: '사장님', STAFF: '알바생' };
  const STATUS = {
    PENDING: '⏳ 승인 대기', ACTIVE: '✅ 근무 중',
    REJECTED: '❌ 거절됨', RESIGNED: '🚪 퇴직'
  };
  try {
    const members = await api('/api/admin/members');
    document.getElementById('staffList').innerHTML = members.map(m => html`
      <div class="audit-row sketch2">
        <span class="nm">${m.displayName}<br>
          <span class="hint">${ROLE[m.role]} · ${m.username}</span></span>
        <span style="font-weight:700; white-space:nowrap">${STATUS[m.status] ?? m.status}</span>
        ${m.status === 'PENDING' ? html`
          <button class="act" style="padding:5px 12px; font-size:0.9rem"
                  onclick="staffAction(${m.id}, 'approve')">승인</button>
          <button class="act danger" style="padding:5px 12px; font-size:0.9rem"
                  onclick="staffAction(${m.id}, 'reject')">거절</button>` : ''}
        ${m.status === 'ACTIVE' && m.role !== 'OWNER' ? html`
          <button class="act danger" style="padding:5px 12px; font-size:0.9rem"
                  data-id="${m.id}" data-name="${m.displayName}"
                  onclick="confirmResign(this)">퇴직 처리</button>` : ''}
        ${(m.status === 'RESIGNED' || m.status === 'REJECTED') ? html`
          <button class="act" style="padding:5px 12px; font-size:0.9rem"
                  onclick="staffAction(${m.id}, 'reinstate')">복직</button>` : ''}
      </div>`).join('');
  } catch (e) { showMsg('stMsg', e.message, false); }
}

/** 퇴직은 권한을 회수하는 되돌리기 어려운 작업이라 한 번 더 확인 */
/* 이름을 onclick 문자열에 직접 넣지 않고 data-* 로 넘긴다.
   속성값은 html`` 이 이스케이프하지만, onclick 안의 JS 문자열은
   브라우저가 속성을 먼저 디코드하므로 이스케이프로 막히지 않는다. */
function confirmResign(btn) {
  const { id, name } = btn.dataset;
  if (!confirm(`${name}님을 퇴직 처리할까요?\n로그인과 모든 기능 접근 권한이 즉시 사라집니다.\n(복직 버튼으로 되돌릴 수 있습니다)`)) return;
  staffAction(id, 'resign');
}
async function staffAction(id, action) {
  try {
    const m = await postJson(`/api/admin/members/${id}/${action}`, {});
    const LABEL = { approve: '승인', reject: '거절', resign: '퇴직 처리', reinstate: '복직' };
    showMsg('stMsg', `${m.displayName}님을 ${LABEL[action] ?? action}했습니다.`, true);
    loadStaff();
  }
  catch (e) { showMsg('stMsg', e.message, false); }
}

/* ===================== 알림 (재고부족 · 예약 · 스케줄 통합) ===================== */

  RESERVATION: { icon: '📅', cls: 'resv',  label: '새 예약' },
  SCHEDULE:    { icon: '🕒', cls: 'sched', label: '근무 스케줄' },
  SIGNUP:      { icon: '🙋', cls: 'member', label: '가입 신청' },
  MEMBER:      { icon: '👤', cls: 'member', label: '직원 변동' },
  NOTICE:      { icon: '📢', cls: 'notice', label: '새 공지' },
  REPORT:      { icon: '📝', cls: 'notice', label: '새 일보' },
  DISPOSE:     { icon: '🗑', cls: 'low',    label: '폐기' }
};

async function refreshAlerts() {
  try {
    const alerts = await api('/api/alerts');
    window._alerts = alerts;
    const badge = document.getElementById('alertBadge');
    if (badge) {
      badge.textContent = alerts.length;
      badge.style.display = alerts.length > 0 ? 'inline-flex' : 'none';
      badge.closest('.bell')?.classList.toggle('has-unread', alerts.length > 0);
    }
  } catch (e) { console.warn('알림 조회 실패:', e.message); }
}

/** 알림·대시보드 상세 줄을 눌렀을 때 — 펼쳐진 패널을 닫고 해당 화면으로 이동 */
function openAlert(route, arg) {
  const panel = document.getElementById('alertPanel');
  if (panel) panel.hidden = true;
  const detail = document.getElementById('dashDetail');
  if (detail) { detail.hidden = true; dashOpenKey = null; markActiveStat(null); }
  go(route, arg ?? undefined);
}

async function toggleAlertPanel() {
  const panel = document.getElementById('alertPanel');
  if (!panel) return;
  if (!panel.hidden) { panel.hidden = true; return; }

  // 열 때마다 새로 조회 — 캐시가 비어 있거나 갱신이 실패했어도 항상 최신 상태를 보여준다
  panel.hidden = false;
  panel.innerHTML = '<p class="hint" style="margin:6px">알림을 불러오는 중...</p>';

  let alerts;
  try {
    alerts = await api('/api/alerts');
    window._alerts = alerts;
  } catch (e) {
    panel.innerHTML = html`<p class="msg error" style="margin:6px">
      알림을 불러오지 못했습니다 — ${e.message}</p>`;
    return;
  }

  panel.innerHTML = alerts.length === 0
    ? '<p class="hint" style="margin:6px">새로운 알림이 없습니다 🎉</p>'
    : alerts.map(a => {
        const m = ALERT_META[a.type] ?? { icon: '•', cls: '', label: '' };
        // 이동할 곳이 있으면 버튼으로 — 누르면 해당 화면으로 바로 간다
        const go = a.route
          ? html`onclick="openAlert('${a.route}', ${a.arg === null ? 'null' : `'${a.arg}'`})"`
          : '';
        return html`<${a.route ? 'button' : 'div'} class="alert-line ${m.cls}${a.route ? ' linked' : ''}" ${go}>
          <span class="ico">${m.icon}</span><span class="txt">${a.message}</span>
          ${a.createdAt ? html`<span class="when">${a.createdAt.replace('T', ' ').slice(5, 16)}</span>` : ''}
          ${a.route ? html`<span class="chev">›</span>` : ''}
        </${a.route ? 'button' : 'div'}>`;
      }).join('');

  const badge = document.getElementById('alertBadge');
  if (badge) {
    badge.textContent = alerts.length;
    badge.style.display = alerts.length > 0 ? 'inline-flex' : 'none';
    badge.closest('.bell')?.classList.toggle('has-unread', alerts.length > 0);
  }

  // 이벤트 알림(예약·스케줄)은 확인했으므로 읽음 처리 — 재고 부족은 재고가 채워져야 사라짐
  if (alerts.some(a => a.id !== null)) {
    try { await postJson('/api/alerts/read-all', {}); refreshAlerts(); } catch { /* 무시 */ }
  }
}

/** 대시보드 항목 정의 — 숫자를 누르면 같은 key로 상세를 펼친다 */
const DASH_STATS = [
  { key: 'todayReservations', field: 'todayReservations', label: '오늘 예약', cls: 'purple', empty: '오늘 예약이 없습니다.' },
  { key: 'onDuty',            field: 'onDutyCount',       label: '근무 중',   cls: 'green',  empty: '현재 근무 중인 직원이 없습니다.' },
  { key: 'lowStock',          field: 'lowStockCount',     label: '재고 부족', cls: 'red',    empty: '부족한 품목이 없습니다.' },
  { key: 'unreadAlerts',      field: 'unreadAlerts',      label: '새 알림',   cls: 'blue',   empty: '새로운 알림이 없습니다.' }
];

let dashOpenKey = null;

/** 숫자 카드를 눌러 상세 목록을 펼치거나 접는다 */
async function toggleDashDetail(key) {
  const box = document.getElementById('dashDetail');
  if (!box) return;

  // 같은 항목을 다시 누르면 닫기
  if (dashOpenKey === key && !box.hidden) {
    box.hidden = true; dashOpenKey = null; markActiveStat(null); return;
  }
  dashOpenKey = key;
  markActiveStat(key);
  box.hidden = false;

  const meta = DASH_STATS.find(s => s.key === key);
  box.innerHTML = html`<div class="dash-detail-head">${meta.label}</div>
    <p class="hint" style="margin:8px 2px">불러오는 중...</p>`;

  try {
    const detail = await api('/api/dashboard/details');
    const rows = detail[key] ?? [];
    box.innerHTML = html`<div class="dash-detail-head">${meta.label}
        <span class="count">${rows.length}</span></div>`
      + (rows.length === 0
          ? html`<p class="hint" style="margin:8px 2px">${meta.empty}</p>`
          : html`<ul class="dash-detail-list">${rows.map(r => r.route
              ? html`<li><button class="detail-link"
                     onclick="openAlert('${r.route}', ${r.arg === null ? 'null' : `'${r.arg}'`})">
                     <span class="txt">${r.text}</span><span class="chev">›</span></button></li>`
              : html`<li>${r.text}</li>`)}</ul>`);
  } catch (e) {
    box.innerHTML = html`<p class="msg error" style="margin:6px 2px">${e.message}</p>`;
  }
}

function markActiveStat(key) {
  document.querySelectorAll('.dash-stat').forEach(b =>
    b.classList.toggle('on', b.dataset.k === key));
}

/* ===================== 재고 목록 (품목 클릭 → 입고/폐기) ===================== */
async function viewStock() {
  $view.innerHTML = topbar('재고목록', 'home') +
    html`<p class="hint">부족한 품목이 맨 위로 정렬돼요. 품목을 누르면 바로 입고·폐기·수정할 수 있습니다.</p>
     <div id="stockGrid" class="stock-grid"></div>
     <p id="skMsg" class="msg" style="text-align:center"></p>`;
  loadStockGrid();

async function loadStockGrid() {
  const items = await api('/api/items');
  // 부족할수록 위로 — 기준 대비 여유분이 적은 순, 같으면 수량이 적은 순
  items.sort((a, b) =>
    (a.quantity - a.minQuantity) - (b.quantity - b.minQuantity)
    || a.quantity - b.quantity
    || a.name.localeCompare(b.name, 'ko'));
  window._items = items;
  const color = i => i.quantity <= i.minQuantity ? 'red'
                   : i.quantity <= i.minQuantity * 2 ? 'orange' : 'blue';
  document.getElementById('stockGrid').innerHTML = items.map(i => html`
    <div class="stock-card ${color(i)}" style="cursor:pointer" onclick="openStockSheet(${i.id})">
      <span class="nm">${i.name}</span>
      <span class="qt">${i.quantity}${i.unit ?? '개'}</span>
    </div>`).join('');
  refreshAlerts();
}

/* 재고 카드 클릭 시 뜨는 액션 시트 */
let sheetMode = 'in', sheetQty = 1, sheetItem = null;

function openStockSheet(itemId) {
  sheetItem = (window._items ?? []).find(i => i.id === itemId);
  if (!sheetItem) return;
  sheetMode = 'in'; sheetQty = 1;
  const el = document.createElement('div');
  el.className = 'sheet-backdrop';
  el.id = 'stockSheet';
  el.onclick = e => { if (e.target === el) closeStockSheet(); };
  el.innerHTML = html`
    <div class="sheet">
      <h3>${sheetItem.name}</h3>
      <p class="cur">현재 ${sheetItem.quantity}${sheetItem.unit ?? '개'}
         · 최소 ${sheetItem.minQuantity}</p>
      <div class="seg">
        <button id="segIn" class="on" onclick="setSheetMode('in')">입고</button>
        <button id="segOut" onclick="setSheetMode('out')">폐기</button>
        <button id="segSet" onclick="setSheetMode('set')">수정</button>
      </div>
      <p id="sheetHint" class="hint" style="text-align:center; margin:0" hidden>
        고친 뒤의 재고 수량을 입력하세요</p>
      <div class="stepper" style="margin:14px 0">
        <button onclick="bumpSheet(-1)">−</button>
        <input class="num" id="sheetNum" type="number" min="1" value="1" oninput="setSheetQty(this.value)">
        <button onclick="bumpSheet(1)">+</button>
      </div>
      <div id="sheetMinWrap" hidden>
        <label class="field"><span>재고 부족 기준 (이 수량 이하면 빨간색·알림)</span>
          <input id="sheetMinQty" type="number" min="0" value="${sheetItem.minQuantity}"></label>
      </div>
      <div id="sheetReasonWrap" hidden>
        <label class="field"><span>폐기 사유</span>
          <select id="sheetReason">
            <option>유통기한 경과</option><option>파손</option>
            <option>변질</option><option>조리 실수</option><option>기타</option>
          </select></label>
      </div>
      <div id="sheetNoteWrap">
        <label class="field"><span>메모</span>
          <input id="sheetNote" placeholder="예: 정기 발주분"></label>
      </div>
      <div style="display:flex; gap:10px; margin-top:6px">
        <button class="act gray" style="flex:1" onclick="closeStockSheet()">닫기</button>
        <button class="act" id="sheetSubmit" style="flex:2" onclick="submitSheet()">입고 처리</button>
      </div>
      <p id="sheetMsg" class="msg" style="text-align:center"></p>
    </div>`;
  document.body.appendChild(el);
}
function closeStockSheet() { document.getElementById('stockSheet')?.remove(); }

/** 입고 / 폐기 / 수정 — 'set'은 변동량이 아니라 "고친 뒤 수량"을 입력받는다 */
function setSheetMode(mode) {
  sheetMode = mode;
  document.getElementById('segIn').className  = mode === 'in'  ? 'on' : '';
  document.getElementById('segOut').className = mode === 'out' ? 'on dispose' : '';
  document.getElementById('segSet').className = mode === 'set' ? 'on' : '';

  document.getElementById('sheetReasonWrap').hidden = mode !== 'out';
  document.getElementById('sheetNoteWrap').hidden   = mode !== 'in';
  document.getElementById('sheetHint').hidden       = mode !== 'set';
  document.getElementById('sheetMinWrap').hidden    = mode !== 'set';

  // 수정은 현재 수량에서 출발하고 0도 허용, 입고/폐기는 1부터
  const num = document.getElementById('sheetNum');
  num.min = mode === 'set' ? 0 : 1;
  sheetQty = mode === 'set' ? sheetItem.quantity : 1;
  num.value = sheetQty;
  if (mode === 'set') document.getElementById('sheetMinQty').value = sheetItem.minQuantity;

  const btn = document.getElementById('sheetSubmit');
  btn.textContent = mode === 'in' ? '입고 처리' : mode === 'out' ? '폐기 처리' : '수량 저장';
  btn.className = mode === 'out' ? 'act danger' : 'act';
}
function sheetMin() { return sheetMode === 'set' ? 0 : 1; }
function bumpSheet(d) {
  sheetQty = Math.max(sheetMin(), sheetQty + d);
  document.getElementById('sheetNum').value = sheetQty;
}
function setSheetQty(v) {
  const n = Number(v);
  sheetQty = Math.max(sheetMin(), Number.isFinite(n) ? n : sheetMin());
}
async function submitSheet() {
  try {
    // 수정은 품목 정보를, 입고·폐기는 변동 이력을 돌려준다
    if (sheetMode === 'set') {
      const item = await api(`/api/items/${sheetItem.id}/quantity`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          quantity: sheetQty,
          minQuantity: Number(document.getElementById('sheetMinQty').value)
        })
      });
      closeStockSheet();
      await loadStockGrid();
      showMsg('skMsg', `${item.name} → 현재 ${item.quantity}${item.unit ?? '개'}`
        + ` · 부족 기준 ${item.minQuantity}`, true);
      return;
    }

    const tx = sheetMode === 'in'
      ? await postJson('/api/inbound', {
          itemId: sheetItem.id, quantity: sheetQty,
          note: document.getElementById('sheetNote').value
        })
      : await postJson('/api/dispose', {
          itemId: sheetItem.id, quantity: sheetQty,
          reason: document.getElementById('sheetReason').value
        });
    closeStockSheet();
    await loadStockGrid();
    showMsg('skMsg', `${tx.itemName} ${tx.quantityChange > 0 ? '+' : ''}${tx.quantityChange}`
      + ` → 현재 ${tx.quantityAfter}`, true);
  } catch (e) { showMsg('sheetMsg', e.message, false); }
}

/* ===================== 입고 / 폐기 (스테퍼) ===================== */
let stepQty = 1;
function stepperHtml() {
  return html`<div class="stepper">
    <button onclick="bumpQty(-1)">−</button>
    <input class="num" id="stepNum" type="number" min="1" value="${stepQty}" oninput="setStepQty(this.value)">
    <button onclick="bumpQty(1)">+</button>
  </div>`;
}
function bumpQty(d) {
  stepQty = Math.max(1, stepQty + d);
  document.getElementById('stepNum').value = stepQty;
}
function setStepQty(v) {
  stepQty = Math.max(1, Number(v) || 1);
}

function toggleIbMode() {
  const isNew = document.getElementById('ibMode').value === 'new';
  document.getElementById('ibExisting').hidden = isNew;
  document.getElementById('ibNew').hidden = !isNew;
}

let scanShots = [];             // 촬영해 둔 사진들 {blob, url} — 아직 서버에 안 보낸 것
const MAX_SHOTS = 8;

function clearScanShots() {
  scanShots.forEach(s => URL.revokeObjectURL(s.url));
  scanShots = [];
}

/** 촬영/선택한 사진을 대기 목록에 담는다 (여러 번 찍어 모을 수 있음) */
async function addScanShots(input) {
  try {
    for (const file of input.files) {
      if (scanShots.length >= MAX_SHOTS) {
        showMsg('scanMsg', `사진은 ${MAX_SHOTS}장까지만 올릴 수 있습니다`, false);
        break;
      }
      const blob = await shrinkImage(file);
      scanShots.push({ blob, url: URL.createObjectURL(blob) });
    }
  } catch (err) { showMsg('scanMsg', err.message, false); }
  finally { input.value = ''; renderScanThumbs(); }
}

/**
 * 폰 사진은 한 장에 3~5MB라 그대로 올리면 업로드도 AI 호출도 느리다.
 * 긴 변 1280px JPEG로 줄여서 보낸다 — 병 개수를 세는 데는 이 해상도로 충분하다.
 */
function shrinkImage(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(src);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('이미지 변환에 실패했습니다')),
                    'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('이미지를 읽을 수 없습니다')); };
    img.src = src;
  });
}

function renderScanThumbs() {
  const box = document.getElementById('scanThumbs');
  if (!box) return;
  box.replaceChildren(...scanShots.map((shot, i) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative';
    const img = document.createElement('img');
    img.src = shot.url;                                  // 로컬 blob — 사용자가 방금 찍은 사진
    img.style.cssText = 'width:72px; height:72px; object-fit:cover; border-radius:8px';
    const del = document.createElement('button');
    del.textContent = '×';
    del.title = '이 사진 빼기';
    del.style.cssText = 'position:absolute; top:-6px; right:-6px; width:22px; height:22px;'
                      + 'border-radius:50%; border:none; background:#333; color:#fff; cursor:pointer';
    del.onclick = () => { URL.revokeObjectURL(shot.url); scanShots.splice(i, 1); renderScanThumbs(); };
    wrap.append(img, del);
    return wrap;
  }));
  document.getElementById('scanRun').hidden = scanShots.length === 0;
}

/** 모아둔 사진을 한 번에 보내 하나의 실사로 인식시킨다 */
async function runScan() {
  if (!scanShots.length) return;
  showMsg('scanMsg', `AI 인식 중... (사진 ${scanShots.length}장)`, true);
  try {
    const fd = new FormData();
    scanShots.forEach((shot, i) => fd.append('images', shot.blob, `scan${i}.jpg`));
    const res = await fetch('/api/audits/scan', { method: 'POST', body: fd });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    clearScanShots();
    renderScanThumbs();
    showMsg('scanMsg', `인식 완료 — ${body.lines.length}개 품목`, true);
    renderAuditLines(body);
  } catch (err) { showMsg('scanMsg', err.message, false); }
}

async function viewAttendance() {

async function loadAttendance() {
  const a = await api('/api/attendance/today');
  const t = v => v ? v.slice(0, 5) : '';
  // 각 단계는 하루에 한 번만 — 이미 찍었거나 아직 순서가 아니면 버튼을 잠근다
  const steps = [
    { action: 'clock-in',  label: '출근',      at: a.clockIn,  ready: !a.clockIn },
    { action: 'break',     label: '휴게 시작', at: a.breakAt,  ready: !!a.clockIn && !a.breakAt && !a.clockOut },
    { action: 'break-end', label: '휴게 종료', at: a.breakEnd, ready: !!a.breakAt && !a.breakEnd && !a.clockOut },
    { action: 'clock-out', label: '퇴근',      at: a.clockOut,
      ready: !!a.clockIn && !a.clockOut && (!a.breakAt || !!a.breakEnd) }
  ];
  // 아직 안 찍었으면 라벨만, 찍었으면 라벨(작게) + 기록된 시각(크게)
  document.getElementById('clockList').innerHTML = steps.map(s => html`
    <button class="clock-btn${s.at ? ' done' : ''}" ${s.ready ? '' : 'disabled'}
            onclick="clock('${s.action}')">
      ${s.at
        ? html`<span class="clock-cap">${s.label}</span><span class="clock-at">${t(s.at)}</span>`
        : html`<span class="clock-label">${s.label}</span>`}
    </button>`).join('')
    + (a.locationLabel ? html`<p class="hint" style="text-align:center; margin-top:6px">
         출근 위치 — ${a.locationLabel}</p>` : '');
}
let clocking = false;
async function clock(action) {
  // 위치 확인에 몇 초가 걸리는 동안 버튼이 살아 있으면 연타로 중복 요청이 쌓인다.
  if (clocking) return;
  clocking = true;
  document.querySelectorAll('#clockList .clock-btn').forEach(b => b.disabled = true);
  try {
    // 출근만 위치를 확인한다. 위치를 못 받아도 출근은 그대로 진행되고 '미확인'으로 기록된다.
    if (action === 'clock-in') showMsg('atMsg', '위치 확인 중...', true);
    const where = action === 'clock-in' ? await currentPosition() : {};
    const a = await postJson('/api/attendance/clock', { action, ...where });
    if (action === 'clock-in') {
      showMsg('atMsg', a.locationLabel ?? '출근했습니다',
              a.locationCheck === 'GPS_OK' || a.locationCheck === 'IP_OK');
    }
  } catch (e) { showMsg('atMsg', e.message, false); }
  finally { clocking = false; loadAttendance(); }   // 다시 그리면서 버튼 잠금도 풀린다
}

/**
 * 현재 위치. 권한 거부·미지원·시간초과면 좌표 없이 진행한다 —
 * 위치가 없다고 출근을 막으면 GPS가 안 잡히는 지하 매장에서 아무도 못 찍는다.
 * (https 또는 localhost 에서만 동작한다. http로 접속하면 브라우저가 요청 자체를 거부한다)
 */
function currentPosition() {
  if (!navigator.geolocation) return Promise.resolve({});
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
      () => resolve({}),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });
}

/* ===================== 일정 (달력) ===================== */
let calY, calM;   // 표시 중인 연/월
async function viewCalendar(keepMonth) {
  if (!keepMonth) { const d = new Date(); calY = d.getFullYear(); calM = d.getMonth() + 1; }
  $view.innerHTML = topbar('일정', 'home',
    isOwner() ? html`<button class="act" style="padding:5px 12px; font-size:0.9rem"
                         onclick="toggleScheduleForm()">근무 등록</button>` : '') + html`
    <div id="schedForm" hidden class="sketch2" style="padding:14px; margin-bottom:14px"></div>
    <div class="cal-head">
      <button onclick="moveMonth(-1)">◀</button>
      <h2>${calY}년 ${String(calM).padStart(2, '0')}월</h2>
      <button onclick="moveMonth(1)">▶</button>
    </div>
    <div class="cal-grid sketch2" style="padding:10px" id="calGrid"></div>
    <div class="day-events" id="dayEvents"></div>`;

  const [notices, reservations, schedules] = await Promise.all([
    api('/api/notices'),
    api(`/api/reservations/month?year=${calY}&month=${calM}`),
    api(`/api/schedules/month?year=${calY}&month=${calM}`)
  ]);
  const events = {};
  const types = {};
  const addEv = (date, text, type) => {
    (events[date] ??= []).push(text);
    (types[date] ??= new Set()).add(type);
  };
  notices.filter(n => n.eventDate?.startsWith(`${calY}-${String(calM).padStart(2, '0')}`))
         .forEach(n => addEv(n.eventDate, `📢 ${n.title}`, 'notice'));
  reservations.forEach(r => addEv(r.reserveDate,
      `📅 예약 ${r.timeSlot} ${r.people}명 (테이블 ${r.tableNumbers.join(', ')})`, 'resv'));
  schedules.forEach(s => addEv(s.workDate,
      `🕒 ${s.memberName} 근무 ${s.startTime ? s.startTime.slice(0, 5) : ''}`
      + `${s.endTime ? '~' + s.endTime.slice(0, 5) : ''}`, 'sched'));

  const grid = document.getElementById('calGrid');
  grid.innerHTML = ['일','월','화','수','목','금','토'].map((d, i) =>
    html`<span class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}"
           style="color:${i === 0 ? 'var(--red)' : i === 6 ? 'var(--blue)' : 'inherit'}">${d}</span>`).join('');

  const first = new Date(calY, calM - 1, 1).getDay();
  const days = new Date(calY, calM, 0).getDate();
  for (let i = 0; i < first; i++) grid.innerHTML += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const dateStr = `${calY}-${String(calM).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dow = (first + d - 1) % 7;
    // 날짜 숫자를 <span>으로 감싸야 정확한 원이 그려진다 (칸은 가로가 더 넓음)
    grid.innerHTML += html`<button class="cal-cell ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}`
      + html`${dateStr === today() ? ' today' : ''}" onclick="showDay('${dateStr}', this)">`
      + html`<span class="d">${d}</span>`
      + html`${calDots(types[dateStr])}</button>`;
  }
  window._calEvents = events;
}

/** 날짜별 점 — 공지=빨강, 근무=보라, 예약=노랑. 여러 종류면 나란히 표시. */
function calDots(set) {
  if (!set || set.size === 0) return '';
  const dots = ['notice', 'sched', 'resv'].filter(t => set.has(t))
      .map(c => `<span class="dot ${c}"></span>`).join('');
  return new SafeHtml(`<span class="cal-dots">${dots}</span>`);
}
function moveMonth(d) {
  calM += d;
  if (calM === 0) { calM = 12; calY--; }
  if (calM === 13) { calM = 1; calY++; }
  viewCalendar(true);
}

let schedDates = [];
let schedCalY, schedCalM;
let _scDrag = null;   // 드래그 중 상태: {anchor, current, base(Set), mode}

function schedCalMove(d) {
  schedCalM += d;
  if (schedCalM === 0)  { schedCalM = 12; schedCalY--; }
  if (schedCalM === 13) { schedCalM = 1;  schedCalY++; }
  renderSchedCal();
}
function isoOf(y, m, d) {
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
/** 폼 안 미니달력 그리기 — 선택된 날은 파랗게, 오늘은 테두리로 */
function renderSchedCal() {
  const grid = document.getElementById('sc-cal');
  if (!grid) return;
  document.getElementById('sc-cal-title').textContent =
    `${schedCalY}년 ${String(schedCalM).padStart(2, '0')}월`;
  const dows = ['일', '월', '화', '수', '목', '금', '토'];
  let h = dows.map(w => html`<div class="sc-cal-dow">${w}</div>`).join('');
  const first = new Date(schedCalY, schedCalM - 1, 1).getDay();
  const days = new Date(schedCalY, schedCalM, 0).getDate();
  for (let i = 0; i < first; i++) h += html`<div class="sc-cal-day blank"></div>`;
  for (let d = 1; d <= days; d++) {
    const iso = isoOf(schedCalY, schedCalM, d);
    const dow = (first + d - 1) % 7;
    const cls = ['sc-cal-day', dow === 0 ? 'sun' : dow === 6 ? 'sat' : '',
                 schedDates.includes(iso) ? 'sel' : '', iso === today() ? 'today' : '']
                .filter(Boolean).join(' ');
    h += html`<div class="${cls}" data-date="${iso}">${d}</div>`;
  }
  grid.innerHTML = h;
  updateSchedSummary();
}
function rangeDates(a, b) {
  let s = new Date(a), e = new Date(b);
  if (s > e) { const t = s; s = e; e = t; }
  const out = [];
  for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
    out.push(isoOf(d.getFullYear(), d.getMonth() + 1, d.getDate()));
  }
  return out;
}
/** 드래그 중 미리보기: 기준 선택(base)에 앵커~현재 범위를 add/remove로 적용 */
function scDragSet() {
  if (!_scDrag) return new Set(schedDates);
  const set = new Set(_scDrag.base);
  for (const iso of rangeDates(_scDrag.anchor, _scDrag.current)) {
    if (_scDrag.mode === 'add') set.add(iso); else set.delete(iso);
  }
  return set;
}
function paintSchedCal(set) {
  document.querySelectorAll('#sc-cal .sc-cal-day[data-date]').forEach(c => {
    c.classList.toggle('sel', set.has(c.dataset.date));
  });
}
function scCellAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el && el.closest('.sc-cal-day[data-date]');
}
/** 드래그 + 개별 탭 — 터치/마우스 모두 지원 (스크롤 방지는 touch-action:none) */
function bindSchedCal() {
  const grid = document.getElementById('sc-cal');
  if (!grid || grid._bound) return;
  grid._bound = true;
  grid.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.sc-cal-day[data-date]');
    if (!cell) return;
    e.preventDefault();
    const iso = cell.dataset.date;
    _scDrag = { anchor: iso, current: iso, base: new Set(schedDates),
                mode: schedDates.includes(iso) ? 'remove' : 'add' };
    try { grid.setPointerCapture(e.pointerId); } catch (_) {}
    paintSchedCal(scDragSet());
  });
  grid.addEventListener('pointermove', e => {
    if (!_scDrag) return;
    const cell = scCellAt(e.clientX, e.clientY);
    if (!cell) return;
    _scDrag.current = cell.dataset.date;
    paintSchedCal(scDragSet());
  });
  const end = () => {
    if (!_scDrag) return;
    schedDates = [...scDragSet()].sort();
    _scDrag = null;
    updateSchedSummary();
  };
  grid.addEventListener('pointerup', end);
  grid.addEventListener('pointercancel', end);
}
function removeSchedDate(d) { schedDates = schedDates.filter(x => x !== d); renderSchedCal(); }
function updateSchedSummary() {
  const box = document.getElementById('sc-dateChips');
  if (!box) return;
  box.innerHTML = schedDates.length === 0
    ? html`<span class="hint">근무일을 달력에서 선택하세요</span>`
    : html`<span class="hint" style="width:100%">선택 ${schedDates.length}일</span>`
      + schedDates.map(d =>
          html`<span class="date-chip">${fmtD(d)}<button type="button" onclick="removeSchedDate('${d}')">×</button></span>`).join('');
}
async function submitSchedule() {
  const memberId = Number(document.getElementById('sc-member').value);
  const dates = schedDates.slice();
  if (dates.length === 0) { showMsg('scMsg', '근무일을 1개 이상 선택하세요.', false); return; }
  const startTime = document.getElementById('sc-start').value;
  const endTime = document.getElementById('sc-end').value;
  const memo = document.getElementById('sc-memo').value;
  try {
    let name = '';
    for (const d of dates) {
      const s = await postJson('/api/schedules', { memberId, workDate: d, startTime, endTime, memo });
      name = s.memberName;
    }
    showMsg('scMsg', `${name}님에게 ${dates.length}일 근무를 등록하고 알림을 보냈습니다.`, true);
    schedDates = [];
    viewCalendar(true);
  } catch (e) { showMsg('scMsg', e.message, false); }
}
function showDay(dateStr, cell) {
  document.querySelectorAll('.cal-cell.sel').forEach(c => c.classList.remove('sel'));
  if (cell) cell.classList.add('sel');
  const evs = window._calEvents[dateStr] ?? [];

        ${[1,2,3,4,5,6,7,8].map(n => html`<option ${draft.people === n ? 'selected' : ''} value="${n}">${n}명</option>`)}
      </select></label>
    <label class="field"><span>예약자명</span>
      <input id="rvName" value="${draft.customerName}" placeholder="예약자 이름"
             oninput="draft.customerName=this.value"></label>
    <button class="act gray" onclick="openTableMap()">테이블 선택
      ${draft.tableIds.length ? ` — ${draft.tableIds.join(', ')}번` : ''}</button>
    <p class="hint" style="margin-top:6px">인원이 많으면 테이블을 여러 개 선택해 붙여 앉힐 수 있습니다.
       배정된 테이블은 <strong>공석 처리하기 전까지</strong> 계속 사용중으로 표시됩니다.</p>
    <div style="text-align:center; margin-top:20px">
      <button class="act" onclick="submitReserve()">확정</button>
    </div>
    <p id="rvMsg" class="msg" style="text-align:center"></p>
    <h3 style="margin-top:26px">이 날짜의 예약</h3>
    <ul class="plain" id="rvList">불러오는 중...</ul>`;
  loadDayReservations();
}
async function loadDayReservations() {
  const list = await api('/api/reservations?date=' + draft.date);
  document.getElementById('rvList').innerHTML = list.length === 0
    ? '<li class="hint">예약이 없습니다</li>'
    : list.map(r => html`<li>
        <div>${r.timeSlot} · 테이블 ${r.tableNumbers.join(', ')}번 · ${r.people}명
          ${r.customerName ? '· ' + r.customerName : ''}
          ${r.courseName ? '· ' + r.courseName : ''}
          ${r.status === 'ACTIVE'
            ? html`<span class="badge-seated">사용중</span>`
            : html`<span class="badge-free">공석</span>`}</div>
        <div style="margin-top:4px">
          ${r.status === 'ACTIVE'
            ? html`<button class="ack-btn" onclick="releaseReserve(${r.id})">공석 처리</button>` : ''}
          <button class="del" style="border:none;background:none;color:var(--red);cursor:pointer;font-family:inherit"
                  onclick="cancelReserve(${r.id})">예약 취소</button>
        </div></li>`).join('');
}

/** 손님이 나간 뒤 — 테이블을 비워 다시 배정 가능하게 만든다 */
async function releaseReserve(id) {
  try {
    await postJson(`/api/reservations/${id}/release`, {});
    showMsg('rvMsg', '공석 처리했습니다. 이제 이 테이블을 다시 배정할 수 있어요.', true);
    loadDayReservations();
  } catch (e) { showMsg('rvMsg', e.message, false); }
}
async function cancelReserve(id) {
  await api('/api/reservations/' + id, { method: 'DELETE' });
  loadDayReservations();
}
function openTableMap() {
  if (!draft.timeSlot) { showMsg('rvMsg', '시간을 먼저 선택하세요.', false); return; }
  go('tables');
}

async function viewTables() {
  if (!draft.timeSlot) { go('reserve-new'); return; }
  $view.innerHTML = topbar(`테이블 선택 (${fmtD(draft.date)} ${draft.timeSlot})`, 'reserve-new')
    + html`<div id="tableMapWrap"></div>`;
  window._tables = await api(`/api/tables?date=${draft.date}&timeSlot=${draft.timeSlot}`);
  renderTableMap();
}

/** 여러 테이블을 눌러 선택/해제 — 정원 합계가 인원 이상이면 확정 가능 */
function renderTableMap() {
  const tables = window._tables ?? [];
  const picked = tables.filter(t => draft.tableIds.includes(t.id));
  const seats = picked.reduce((s, t) => s + t.capacity, 0);
  const need = draft.people ?? 0;
  const enough = picked.length > 0 && seats >= need;

  document.getElementById('tableMapWrap').innerHTML = html`
    <p class="hint" style="text-align:center">
      빨간 테이블은 사용중(공석 처리 전) · 여러 개를 눌러 붙여 앉힐 수 있습니다</p>
    <div class="table-grid">` + tables.map(t => html`
      <button class="tbl-cell ${t.reserved ? 'reserved' : ''} ${draft.tableIds.includes(t.id) ? 'sel' : ''}"
              ${t.reserved ? 'disabled' : html`onclick="toggleTable(${t.id})"`}>
        <span class="tno">${t.number}</span><small>${t.capacity}인</small>
      </button>`).join('') + html`</div>
    <div class="sketch2" style="padding:12px; margin-top:14px; text-align:center">
      <div style="font-weight:700; font-size:1.1rem">
        선택 ${picked.length}개 · 총 ${seats}석 / 인원 ${need}명
        <span style="color:${enough ? 'var(--green)' : 'var(--red)'}">
          ${picked.length === 0 ? '' : (enough ? '✓' : '자리 부족')}</span>
      </div>
      <div class="hint">${picked.length
        ? '테이블 ' + picked.map(t => t.number).sort((a,b)=>a-b).join(', ') + '번'
        : '테이블을 선택하세요'}</div>
      <button class="act" style="margin-top:10px" onclick="go('reserve-new')">선택 완료</button>
    </div>`;
}
function toggleTable(id) {
  const i = draft.tableIds.indexOf(id);
  if (i >= 0) draft.tableIds.splice(i, 1); else draft.tableIds.push(id);
  renderTableMap();
}

/** 화면 중앙에 뜨는 확정 팝업 — 1.8초 뒤 자동으로 닫히고, 눌러도 닫힌다 */
function showToast(text, icon = '✅') {
  const back = document.createElement('div');
  back.className = 'toast-backdrop';
  back.innerHTML = html`<div class="toast-pop"><div class="ic">${icon}</div><div class="tx">${text}</div></div>`;
  const close = () => back.remove();
  back.addEventListener('click', close);
  document.body.appendChild(back);
  setTimeout(close, 1800);
}
async function submitReserve() {
  if (!draft.timeSlot || !draft.people || draft.tableIds.length === 0) {
    showMsg('rvMsg', '시간·인원·테이블을 모두 선택하세요.', false); return;
  }
  try {
    await postJson('/api/reservations', {
      reserveDate: draft.date, timeSlot: draft.timeSlot, people: draft.people,
      tableIds: draft.tableIds, customerName: draft.customerName, courseName: draft.courseName
    });
    showToast('예약이 확정되었습니다', '🎉');
    showMsg('rvMsg', '예약이 확정되었습니다.', true);
    draft.tableIds = []; draft.timeSlot = null; draft.people = null;
    loadDayReservations();
  } catch (e) { showMsg('rvMsg', e.message, false); }
}

/* ---- 매장 위치 지도 (사장님 설정 화면에서만 씀) ---- */
let storeMap = null, storeMarker = null, storeCircle = null, leafletLoading = null;

/**
 * Leaflet을 설정 화면을 열 때만 내려받는다.
 * 알바가 매일 쓰는 출근·재고 화면에까지 지도 라이브러리를 얹을 이유가 없다.
 */
function loadLeaflet() {
  if (leafletLoading) return leafletLoading;
  leafletLoading = new Promise((resolve, reject) => {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.';
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = base + 'min.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = base + 'min.js';
    js.onload = resolve;
    js.onerror = () => { leafletLoading = null; reject(new Error('지도를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); };
    document.head.appendChild(js);
  });
  return leafletLoading;
}

/** 저장된 좌표(없으면 현재 위치)를 중심으로 지도를 띄운다 */
async function initStoreMap(saved) {
  const box = document.getElementById('storeMap');
  if (!box) return;
  try { await loadLeaflet(); } catch (e) { box.innerHTML = html`<p class="hint" style="padding:12px">${e.message}</p>`; return; }
  if (!document.getElementById('storeMap')) return;   // 그 사이 다른 화면으로 이동함

  let lat = saved?.latitude, lng = saved?.longitude;
  if (lat == null) {                       // 미설정이면 현재 위치에서 시작한다
    const where = await currentPosition();
    lat = where.latitude ?? 37.5665;       // 위치도 못 받으면 서울시청을 임시 중심으로
    lng = where.longitude ?? 126.9780;
  }
  const radius = Number(document.getElementById('stRadius')?.value) || 200;

  storeMap = L.map('storeMap').setView([lat, lng], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(storeMap);

  storeCircle = L.circle([lat, lng], { radius, color: '#c96', weight: 2, fillOpacity: 0.15 }).addTo(storeMap);
  storeMarker = L.marker([lat, lng], { draggable: true }).addTo(storeMap);
  fitToCircle();   // 반경이 화면을 넘어가면 원이 안 보이므로 원에 맞춰 줌을 잡는다
  storeMarker.on('drag', e => moveStorePin(e.target.getLatLng()));
  storeMap.on('click', e => { storeMarker.setLatLng(e.latlng); moveStorePin(e.latlng); });
}

/** 핀을 옮기면 반경 원도 따라간다 (저장은 별도 버튼) */
function moveStorePin(latlng) {
  storeCircle.setLatLng(latlng);
  const label = document.getElementById('stCoordLabel');
  if (label) label.textContent = '저장 안 됨 (이동함)';
}

function onRadiusChange(value) {
  document.getElementById('stRadiusLabel').textContent = value + 'm';
  if (storeCircle) storeCircle.setRadius(Number(value));
}

/** 원 전체가 보이도록 줌을 맞춘다 (슬라이더를 놓았을 때만 — 끄는 도중에 튀면 어지럽다) */
function fitToCircle() {
  if (storeMap && storeCircle) storeMap.fitBounds(storeCircle.getBounds(), { padding: [16, 16] });
}

/** 핀을 지금 내 위치로 점프 */
async function pinToCurrentPosition() {
  showMsg('stLocMsg', '위치 확인 중...', true);
  const where = await currentPosition();
  if (where.latitude === undefined) {
    showMsg('stLocMsg', '위치를 가져올 수 없습니다. 위치 권한을 허용했는지, https 또는 localhost로 접속했는지 확인하세요.', false);
    return;
  }
  const latlng = [where.latitude, where.longitude];
  storeMarker.setLatLng(latlng);
  storeMap.setView(latlng, 18);
  moveStorePin(storeMarker.getLatLng());
  showMsg('stLocMsg', '현재 위치로 핀을 옮겼습니다. 확인 후 "이 위치로 저장"을 누르세요.', true);
}

/** 지도에서 맞춘 핀 위치와 반경을 서버에 저장 */
async function saveStoreLocation() {
  if (!storeMarker) { showMsg('stLocMsg', '지도가 아직 준비되지 않았습니다.', false); return; }
  const { lat, lng } = storeMarker.getLatLng();
  try {
    await api('/api/store/attendance-location', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ latitude: lat, longitude: lng,
                             radius: Number(document.getElementById('stRadius').value) })
    });
    document.getElementById('stCoordLabel').textContent = '설정됨';
    showMsg('stLocMsg', '매장 위치를 저장했습니다.', true);
  } catch (e) { showMsg('stLocMsg', e.message, false); }
}
async function setStoreIp() {
  try { await postJson('/api/store/attendance-ip', {}); loadSettings(); }
  catch (e) { showMsg('stLocMsg', e.message, false); }
}
async function clearStoreIp() {
  try { await api('/api/store/attendance-ip', { method: 'DELETE' }); loadSettings(); }
  catch (e) { showMsg('stLocMsg', e.message, false); }
}
async function regenCode() {
  if (!confirm('코드를 재발급할까요?\n이전 코드로는 더 이상 가입·로그인할 수 없습니다.')) return;

  catch (e) { showMsg('stMsg2', e.message, false); }
}

    await postJson('/api/store/tables', {
      number: Number(document.getElementById('tbNum').value),
      capacity: Number(document.getElementById('tbCap').value)
    });
    loadSettings();
  } catch (e) { showMsg('stMsg2', e.message, false); }
}
async function delTable(id) {
  try { await api('/api/store/tables/' + id, { method: 'DELETE' }); loadSettings(); }

async function addCourse() {
  try {
    const name = document.getElementById('crsName').value.trim();
    if (!name) return;
    const durationMinutes = Number(document.getElementById('crsDuration').value) || null;
    const unlimitedRefill = document.getElementById('crsRefill').value === 'true';
    await postJson('/api/store/courses', { name, durationMinutes, unlimitedRefill });
    loadSettings();
  } catch (e) { showMsg('stMsg2', e.message, false); }
}
async function delCourse(id) {
  try { await api('/api/store/courses/' + id, { method: 'DELETE' }); loadSettings(); }
  catch (e) { showMsg('stMsg2', e.message, false); }
